[workspace]
resolver = "2"
members = ["crates/core", "crates/audio", "crates/app", "crates/ferramentas", "crates/ui"]

[workspace.package]
version = "0.0.1"
edition = "2021"
license = "MIT"

# Versões num lugar só; cada crate escolhe o que usa (e as features do `windows`).
[workspace.dependencies]
voicerune = { path = "crates/app", default-features = false }
voicerune-core = { path = "crates/core" }
voicerune-audio = { path = "crates/audio" }
voicerune-ui = { path = "crates/ui" }
cpal = "0.18.2"
nnnoiseless = { version = "0.5.2", default-features = false }
rtrb = "0.4.0"
windows = "0.62"
# DeepFilterNet3 (libDF + tract). Fora do crates.io (lá só a 0.2.5 antiga): commit da tag v0.5.6,
# fixado também no Cargo.lock. O modelo padrão (8 MB) vem embutido no binário.
deep_filter = { git = "https://github.com/Rikorose/DeepFilterNet", rev = "978576aa8400552a4ce9730838c635aa30db5e61", default-features = false, features = ["tract", "default-model"] }
ndarray = "0.15"
hound = "3.5"
# UI: sem features padrão (sem OpenGL/femtovg). `system-tray` usa Shell_NotifyIconW no Windows
# (ksni só no Linux); `unstable-winit-030` dá o foco/HWND do flyout (o winit já vinha).
slint = { version = "1.18.1", default-features = false, features = ["std", "compat-1-2", "backend-winit", "renderer-software", "system-tray", "unstable-winit-030"] }
slint-build = "1.18.1"
# Só no `voicerune-dev icone` (gera o .ico); já vinha na árvore pelo Slint.
resvg = { version = "0.48.1", default-features = false }
