[package]
name = "voicerune-ferramentas"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

# Ferramentas de desenvolvimento (medição); não vão para o usuário final.
[[bin]]
name = "voicerune-dev"
path = "src/main.rs"

[dependencies]
voicerune.workspace = true
voicerune-core.workspace = true
voicerune-audio.workspace = true
hound.workspace = true
resvg.workspace = true

# Sonda do WASAPI: consulta o Windows direto (o crate já vem na árvore pelo cpal).
[target.'cfg(windows)'.dependencies]
windows = { workspace = true, features = [
    "Win32_Devices_Properties",
    "Win32_Media_Audio",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Variant",
    "Win32_UI_Shell_PropertiesSystem",
] }

[features]
default = ["dfn"]
dfn = ["voicerune-core/dfn", "voicerune/dfn"]
realtime = ["voicerune-audio/realtime"]
