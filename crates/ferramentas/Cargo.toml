[package]
name = "mic-limpo-ferramentas"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

# Ferramentas de desenvolvimento (medição); não vão para o usuário final.
[[bin]]
name = "mic-limpo-dev"
path = "src/main.rs"

[dependencies]
mic-limpo.workspace = true
mic-limpo-core.workspace = true
mic-limpo-audio.workspace = true
hound.workspace = true

# Sonda do WASAPI: consulta o Windows direto (o crate já vem na árvore pelo cpal).
[target.'cfg(windows)'.dependencies]
windows = { workspace = true, features = [
    "Win32_Devices_Properties",
    "Win32_Media_Audio",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Variant",
    "Win32_UI_Shell_PropertiesSystem",
] }

[features]
default = ["dfn"]
dfn = ["mic-limpo-core/dfn", "mic-limpo/dfn"]
realtime = ["mic-limpo-audio/realtime"]
