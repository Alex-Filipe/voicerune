[package]
name = "mic-limpo"
version.workspace = true
edition.workspace = true
license.workspace = true

# Programa do usuário: só liga o motor (core) a um backend (audio). Ferramentas de medição
# ficam em `crates/ferramentas`, fora deste binário.
[dependencies]
mic-limpo-core.workspace = true
mic-limpo-audio.workspace = true

[features]
realtime = ["mic-limpo-audio/realtime"]
