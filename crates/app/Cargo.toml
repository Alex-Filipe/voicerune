[package]
name = "mic-limpo"
version.workspace = true
edition.workspace = true
license.workspace = true

# Programa do usuário: a janela (`crates/ui`) ligada ao motor (core) e aos backends (audio) pelo
# `Controlador` (lib, também usado por `mic-limpo-dev rodar`). Ferramentas de medição ficam em
# `crates/ferramentas`, fora deste binário.
[dependencies]
mic-limpo-core.workspace = true
mic-limpo-audio.workspace = true
mic-limpo-ui.workspace = true
slint.workspace = true

[features]
default = ["dfn"]
dfn = ["mic-limpo-core/dfn"]
realtime = ["mic-limpo-audio/realtime"]
