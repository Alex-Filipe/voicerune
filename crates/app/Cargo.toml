[package]
name = "voicerune"
version.workspace = true
edition.workspace = true
license.workspace = true

# Programa do usuário: a janela (`crates/ui`) ligada ao motor (core) e aos backends (audio) pelo
# `Controlador` (lib, também usado por `voicerune-dev rodar`). Ferramentas de medição ficam em
# `crates/ferramentas`, fora deste binário.
[dependencies]
voicerune-core.workspace = true
voicerune-audio.workspace = true
voicerune-ui.workspace = true
slint.workspace = true

# Encostar o flyout na barra de tarefas (cursor, área útil e DPI do monitor), CPU do processo e
# instância única (evento nomeado) e iniciar com o sistema (registro).
[target.'cfg(windows)'.dependencies]
windows = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_HiDpi",
    "Win32_UI_WindowsAndMessaging",
] }

# CPU do processo (`getrusage`) fora do Windows.
[target.'cfg(unix)'.dependencies]
libc.workspace = true

# Fase 5 (teste): no Mac a janela é desenhada na GPU (FemtoVG/OpenGL), que vira o renderizador padrão
# do winit quando ligado. O de software não tem alfa no Mac (softbuffer opaco, sem vidro) e gasta a
# thread da janela convertendo cor a cada quadro. No Windows nada muda.
[target.'cfg(target_os = "macos")'.dependencies]
slint = { workspace = true, features = ["renderer-femtovg"] }

[features]
default = ["dfn"]
dfn = ["voicerune-core/dfn"]
realtime = ["voicerune-audio/realtime"]
